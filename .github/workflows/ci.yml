name: Проверки NEXUS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Код, тесты и данные
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить проект
        run: python -m pip install --disable-pip-version-check -e ".[dev]" pip-audit
      - name: Проверить стиль
        run: ruff check .
      - name: Запустить тесты
        run: pytest
      - name: Собрать данные и статический API
        run: python -m nexus.pipeline --generate --data data/processed --api site/api/v1
      - name: Проверить зависимости
        run: pip-audit
      - name: Проверить отсутствие секретов
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Сохранить статическую сборку
        uses: actions/upload-artifact@v4
        with:
          name: nexus-site
          path: site
          if-no-files-found: error
          retention-days: 7
