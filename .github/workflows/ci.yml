name: Проверки NEXUS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Код, тесты и данные
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Настроить Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить проект
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
          python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Проверить стиль
        run: ruff check .
      - name: Запустить тесты
        run: pytest
      - name: Собрать данные и статический API
        run: python -m nexus.pipeline --generate --data data/processed --api site/api/v1
      - name: Проверить зависимости
        run: pip-audit --skip-editable
      - name: Проверить отсутствие секретов
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Сохранить статическую сборку
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nexus-site
          path: site
          if-no-files-found: error
          retention-days: 7
